<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>TelcoInsight AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Calistoga', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#FAFAFA',
              foreground: '#0F172A',
              muted: '#F1F5F9',
              'muted-foreground': '#64748B',
              accent: '#0052FF',
              'accent-secondary': '#4D7CFF',
              border: '#E2E8F0',
            },
            backgroundImage: {
              'accent-gradient': 'linear-gradient(135deg, #0052FF, #4D7CFF)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FAFAFA;
        color: #0F172A;
      }
      .gradient-text {
        background: linear-gradient(to right, #0052FF, #4D7CFF);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #E2E8F0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #CBD5E1;
      }
    </style>
